<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Galería Privada</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0f0f;
      color: #eee;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    #gate {
      margin-top: 12vh;
      text-align: center;
      width: 100%;
      max-width: 420px;
      padding: 0 8px;
    }
    #gate h1 { 
      font-size: 1.5rem; 
      margin-bottom: 1.8rem; 
      font-weight: 500; 
      letter-spacing: -0.02em;
    }
    #gate input {
      width: 100%;
      padding: 18px 20px;
      font-size: 1.15rem;
      border: none;
      border-radius: 12px;
      background: #1a1a1a;
      color: #fff;
      outline: none;
      border: 1px solid #333;
      -webkit-appearance: none;
    }
    #gate input:focus { border-color: #666; }
    #error { 
      color: #ff6b6b; 
      margin-top: 14px; 
      font-size: 0.95rem; 
      min-height: 1.3em; 
    }
    #gallery { 
      display: none; 
      width: 100%; 
      max-width: 1200px; 
    }
    #gallery h2 { 
      margin: 12px 0 18px; 
      text-align: center; 
      font-weight: 500; 
      font-size: 1.35rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      padding: 4px;
    }
    .item {
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.45);
    }
    .item img, .item video {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
    }
    .item video { 
      max-height: 70vh; 
      object-fit: contain; 
    }
    .caption {
      padding: 10px 12px;
      font-size: 0.9rem;
      color: #bbb;
      text-align: center;
    }

    /* Mobile optimizations */
    @media (max-width: 700px) {
      body { padding: 10px; }
      #gate { margin-top: 8vh; }
      #gate h1 { font-size: 1.45rem; margin-bottom: 1.4rem; }
      #gate input { 
        padding: 20px 18px; 
        font-size: 1.2rem; 
        border-radius: 14px;
      }
      .grid { 
        grid-template-columns: 1fr; 
        gap: 12px; 
      }
      .item video { max-height: 60vh; }
      .caption { font-size: 0.95rem; padding: 12px; }
    }
    @media (max-width: 380px) {
      #gate input { font-size: 1.1rem; padding: 18px 16px; }
    }
  </style>
</head>
<body>
  <div id="gate">
    <h1>Ingresa la contraseña</h1>
    <input type="password" id="pass" placeholder="Contraseña" autofocus autocomplete="off" enterkeyhint="go">
    <div id="error"></div>
  </div>

  <div id="gallery">
    <h2>Fotos y Videos</h2>
    <div class="grid" id="content"></div>
  </div>

  <script>
    const PASSWORD = "acceso123";
    const passInput = document.getElementById("pass");
    const errorDiv = document.getElementById("error");
    const gate = document.getElementById("gate");
    const gallery = document.getElementById("gallery");
    const content = document.getElementById("content");

    passInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") checkPassword();
    });

    function checkPassword() {
      if (passInput.value === PASSWORD) {
        gate.style.display = "none";
        gallery.style.display = "block";
        loadMedia();
        // Scroll to top on mobile
        window.scrollTo(0, 0);
      } else {
        errorDiv.textContent = "Contraseña incorrecta";
        passInput.value = "";
        passInput.focus();
      }
    }

    function loadMedia() {
      const images = [
        "media/img001.jpeg",
        "media/img002.jpeg",
        "media/img003.jpeg",
        "media/img004.jpeg",
        "media/img005.jpeg",
        "media/img006.jpeg",
        "media/img007.jpeg",
        "media/img008.jpeg",
        "media/img009.jpeg",
        "media/img010.jpeg",
        "media/img011.jpeg",
        "media/img012.jpeg",
        "media/img013.jpeg",
        "media/img014.jpeg",
        "media/img015.jpeg",
        "media/img016.jpeg",
        "media/img017.jpeg",
        "media/img018.jpeg",
        "media/img019.jpeg",
        "media/img020.jpeg",
        "media/img021.jpeg",
        "media/img022.jpeg",
      ];
      const videos = [
        "media/vid001.mp4",
        "media/vid002.mp4",
        "media/vid003.mp4",
        "media/vid004.mp4",
        "media/vid006.mp4",
        "media/vid007.mp4",
        "media/vid008.mp4",
        "media/vid009.mp4",
        "media/vid010.mp4",
        "media/vid011.mp4",
        "media/vid012.mp4",
        "media/vid013.mp4",
      ];

      images.forEach((src, i) => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `<img src="${src}" alt="Foto ${i+1}" loading="lazy"><div class="caption">Foto ${i+1}</div>`;
        content.appendChild(div);
      });

      videos.forEach((src, i) => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `<video src="${src}" controls playsinline preload="metadata"></video><div class="caption">Video ${i+1}</div>`;
        content.appendChild(div);
      });
    }
  </script>
</body>
</html>
